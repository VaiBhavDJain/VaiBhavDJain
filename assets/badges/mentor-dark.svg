  <style>
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 70% { opacity: 1; transform: scale(1.06); } 100% { transform: scale(1); } }
    @keyframes sweep { 0%, 70% { transform: translateX(-150px) skewX(-20deg); } 100% { transform: translateX(170px) skewX(-20deg); } }
    @keyframes glow { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.7; } }
    .medal { transform-origin: 100px 80px; animation: pop 0.7s cubic-bezier(.2,.8,.3,1.2) 0.30s both; }
    .shine { animation: sweep 5s ease-in-out 2.10s infinite; }
    .halo { animation: glow 4s ease-in-out 0.80s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="medal">
