    <polygon points="100.0,26.0 146.8,53.0 146.8,107.0 100.0,134.0 53.2,107.0 53.2,53.0" fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="2"/>
    <g clip-path="url(#c)"><rect class="shine" x="40" y="0" width="56" height="170" fill="url(#s)"/></g>
