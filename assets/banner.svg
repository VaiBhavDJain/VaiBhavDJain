<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Vaibhav Jain, Senior Full Stack Engineer</title>
  <desc id="desc">Senior Full Stack Engineer working across Ruby on Rails, React.js, Node.js and Python, building web platforms, APIs, microservices and AI features.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.35" stop-color="#6366f1"/>
      <stop offset="0.7" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#06b6d4" stop-opacity="0.25"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes appear { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    @keyframes driftA { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, 18px); } }
    @keyframes driftB { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(50px, -16px); } }
    .r1 { animation: rise 0.7s ease-out 0.10s both; }
    .r2 { animation: rise 0.7s ease-out 0.30s both; }
    .r3 { animation: rise 0.7s ease-out 0.50s both; }
    .r4 { animation: rise 0.7s ease-out 0.70s both; }
    .r5 { animation: rise 0.7s ease-out 0.90s both; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .orbit { transform-origin: 1000px 160px; animation: spin 60s linear infinite; }
    .orbit2 { transform-origin: 1000px 160px; animation: spin 90s linear infinite reverse; }
    .spoke { stroke: #818cf8; stroke-opacity: 0.45; stroke-width: 1.5; stroke-dasharray: 3 6; animation: flow 1.2s linear infinite; }
    .sat { transform-box: fill-box; transform-origin: center; animation: appear 0.6s ease-out both; }
    .halo { animation: breathe 3.2s ease-in-out infinite; }
    .core { transform-origin: 1000px 160px; animation: appear 0.6s ease-out 0.6s both; }
    .orbA { animation: driftA 14s ease-in-out infinite; }
    .orbB { animation: driftB 16s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="orbA" cx="1000" cy="150" r="300" fill="url(#glowA)"/>
    <circle class="orbB" cx="160" cy="360" r="260" fill="url(#glowB)"/>
    <rect width="1200" height="4" fill="url(#topline)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g class="r1">
    <text x="64" y="70" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#67e8f9" textLength="259" lengthAdjust="spacingAndGlyphs">vaibhav@indore:~$ whoami</text>
    <rect class="cursor" x="331" y="55" width="10" height="19" fill="#67e8f9"/>
  </g>
  <text class="r2" x="62" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1">Vaibhav Jain</text>
  <text class="r3" x="64" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#e0e7ff">Senior Full Stack Engineer</text>
  <text class="r4" x="64" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="21" font-weight="600"><tspan fill="#ff8a8a">Ruby on Rails</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#67e8f9">React.js</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#a3e635">Node.js</tspan></text>
  <text class="r5" x="64" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">Building web platforms, APIs, microservices &amp; Python-powered AI features</text>

  <g>
    <circle class="orbit" cx="1000" cy="160" r="118" fill="none" stroke="#94a3b8" stroke-opacity="0.22" stroke-dasharray="2 9"/>
    <circle class="orbit2" cx="1000" cy="160" r="148" fill="none" stroke="#818cf8" stroke-opacity="0.12" stroke-dasharray="1 14"/>
    <line class="spoke" x1="960.2" y1="137.0" x2="923.8" y2="116.0"/><line class="spoke" x1="1000.0" y1="114.0" x2="1000.0" y2="72.0"/><line class="spoke" x1="1039.8" y1="137.0" x2="1076.2" y2="116.0"/><line class="spoke" x1="1039.8" y1="183.0" x2="1076.2" y2="204.0"/><line class="spoke" x1="1000.0" y1="206.0" x2="1000.0" y2="248.0"/><line class="spoke" x1="960.2" y1="183.0" x2="923.8" y2="204.0"/>
    <circle r="3.6" fill="#ff6b6b" opacity="0"><animateMotion dur="2.4s" begin="0.00s" repeatCount="indefinite" path="M960.2 137.0L923.8 116.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.4s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#61dafb" opacity="0"><animateMotion dur="2.4s" begin="0.45s" repeatCount="indefinite" path="M1000.0 72.0L1000.0 114.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.4s" begin="0.45s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#8cc84b" opacity="0"><animateMotion dur="2.4s" begin="0.90s" repeatCount="indefinite" path="M1039.8 137.0L1076.2 116.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.4s" begin="0.90s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#ffd43b" opacity="0"><animateMotion dur="2.4s" begin="1.35s" repeatCount="indefinite" path="M1076.2 204.0L1039.8 183.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.4s" begin="1.35s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#7aa2f7" opacity="0"><animateMotion dur="2.4s" begin="1.80s" repeatCount="indefinite" path="M1000.0 206.0L1000.0 248.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.4s" begin="1.80s" repeatCount="indefinite"/></circle><circle r="3.6" fill="#ff9900" opacity="0"><animateMotion dur="2.4s" begin="2.25s" repeatCount="indefinite" path="M923.8 204.0L960.2 183.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.4s" begin="2.25s" repeatCount="indefinite"/></circle>
    <g class="core">
      <circle cx="1000" cy="160" r="42" fill="none" stroke="#818cf8" stroke-width="2">
        <animate attributeName="r" values="42;74" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="160" r="42" fill="url(#core)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="1000" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="800" fill="#ffffff">&lt;/&gt;</text>
    </g>
    <g class="sat" style="animation-delay:0.90s"><circle class="halo" style="animation-delay:0.0s" cx="897.8" cy="101.0" r="34" fill="#ff6b6b" fill-opacity="0.16"/><circle cx="897.8" cy="101.0" r="28" fill="#0f172a" stroke="#ff6b6b" stroke-width="2"/><text x="897.8" y="105.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#e2e8f0">Rails</text></g><g class="sat" style="animation-delay:1.02s"><circle class="halo" style="animation-delay:0.5s" cx="1000.0" cy="42.0" r="34" fill="#61dafb" fill-opacity="0.16"/><circle cx="1000.0" cy="42.0" r="28" fill="#0f172a" stroke="#61dafb" stroke-width="2"/><text x="1000.0" y="46.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#e2e8f0">React</text></g><g class="sat" style="animation-delay:1.14s"><circle class="halo" style="animation-delay:1.0s" cx="1102.2" cy="101.0" r="34" fill="#8cc84b" fill-opacity="0.16"/><circle cx="1102.2" cy="101.0" r="28" fill="#0f172a" stroke="#8cc84b" stroke-width="2"/><text x="1102.2" y="105.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#e2e8f0">Node</text></g><g class="sat" style="animation-delay:1.26s"><circle class="halo" style="animation-delay:1.5s" cx="1102.2" cy="219.0" r="34" fill="#ffd43b" fill-opacity="0.16"/><circle cx="1102.2" cy="219.0" r="28" fill="#0f172a" stroke="#ffd43b" stroke-width="2"/><text x="1102.2" y="223.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#e2e8f0">Python</text></g><g class="sat" style="animation-delay:1.38s"><circle class="halo" style="animation-delay:2.0s" cx="1000.0" cy="278.0" r="34" fill="#7aa2f7" fill-opacity="0.16"/><circle cx="1000.0" cy="278.0" r="28" fill="#0f172a" stroke="#7aa2f7" stroke-width="2"/><text x="1000.0" y="282.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#e2e8f0">SQL</text></g><g class="sat" style="animation-delay:1.50s"><circle class="halo" style="animation-delay:2.5s" cx="897.8" cy="219.0" r="34" fill="#ff9900" fill-opacity="0.16"/><circle cx="897.8" cy="219.0" r="28" fill="#0f172a" stroke="#ff9900" stroke-width="2"/><text x="897.8" y="223.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#e2e8f0">AWS</text></g>
  </g>
</svg>
